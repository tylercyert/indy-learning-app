<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      The "Add to Home Screen" shell (issue #52). With web.output "single", Expo uses this file as
      the template for dist/index.html: it fills the lang and title placeholders (first occurrence
      only, so do not repeat them), appends the script tags, the favicon link and the
      theme-color/description metas from app.json. (app/+html.tsx is
      only used by the "static" and "server" outputs, which the API server's SPA fallback does not
      serve.) Metro does not write a manifest from app.json, so public/manifest.json and
      public/icons/ are the manifest and icons; Expo copies public/ to the site root.

      Status bar (#59): the standard style. iOS draws its own status bar and the app starts below it,
      so nothing depends on reading safe-area insets in JavaScript. black-translucent with
      viewport-fit=cover put the Poko bar under the clock on a real iPhone (insets read as 0) and
      left a strip at the bottom of the Home Screen app.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>%WEB_TITLE%</title>
    <meta name="application-name" content="Poko" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Poko" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        background: #ffffff;
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="poko-shell">
      /* The document never scrolls (the app's ScrollViews do) and never rubber-bands. The page
         background is the app-bar purple (#63): newer Safari tints its own bar and the status-bar
         area from the page background instead of theme-color, so both match the Poko bar. The app
         root paints white over it, so the purple shows only in browser chrome. */
      html,
      body {
        margin: 0;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        background: #6d28d9;
        overflow-x: hidden;
      }
      /* height:100% already follows Safari's toolbar; dvh says so explicitly where supported. */
      @supports (height: 100dvh) {
        html,
        body,
        #root {
          height: 100dvh;
        }
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }
      button,
      [role='button'] {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
      }
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
